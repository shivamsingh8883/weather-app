<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body class="bg-gray-800 flex justify-center items-center min-h-screen">
    <div class="border border-grey-100 rounded-xl w-[400px] p-2">
        <h1 class="flex justify-center text-gray-200 text-3xl font-[450] m-5 mb-20">Weather App</h1>
        <div class="m-5 flex justify-center items-center mb-10">
            <input id="city_input" class="bg-gray-600 focus:bg-gray-600 focus:outline-none border-grey rounded-l-lg p-2 text-gray-200" type="text" placeholder="Enter location">
            <button id="searchbtn" class="border-black p-2 bg-blue-400 border rounded-r-lg">Search</button>
        </div>
        <div class="text-gray-300
                text-xl space-y-3">
            <h2 class="flex justify-center items-center mb-5" id="city_name"></h2>
            <h3 class="ml-10 mb-4" id="temperature"></h3>
            <h3 class="ml-10 mb-4"  id="weather_condition"></h3>
            <h3 class="ml-10 mb-4" id="humidity"></h3>
            <h2 class="flex justify-center items-center mb-4 text-red-500" id="error_msg"></h2>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
