<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-gray-800 flex justify-center items-center min-h-screen">
    <div class="border rounded">
        <h1 class="flex justify-center items-center text-gray-200 text-2xl m-5">Weather App</h1>
        <div class="m-5">
            <input id="city_input" class="bg-gray-700 border rounded m-4 p-2" type="text" placeholder="Enter location">
            <button id="searchbtn" class="border-black m-4 p-2 bg-blue-400 border rounded">Search</button>
        </div>
        <div class="text-gray-300
                text-xl">
            <h2 class="flex justify-center items-center mb-5" id="city_name"></h2>
            <h3 class="ml-10 mb-4" id="temperature"></h3>
            <h3 class="ml-10 mb-4"  id="weather_condition"></h3>
            <h3 class="ml-10 mb-4" id="humidity"></h3>
            <h2 class="flex justify-center items-center mb-4 text-red-500" id="error_msg"></h2>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
